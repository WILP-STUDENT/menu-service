apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-db
  namespace: foodapp
spec:
  replicas: 1
  selector:
    matchLabels: {app: menu-db}
  template:
    metadata:
      labels: {app: menu-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: menudb}
            - {name: POSTGRES_USER, value: menuuser}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: menu-db
  namespace: foodapp
spec:
  selector: {app: menu-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: foodapp
spec:
  replicas: 2
  selector:
    matchLabels: {app: menu-service}
  template:
    metadata:
      labels: {app: menu-service}
    spec:
      containers:
        - name: menu-service
          image: menu-service:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5001}]
          env:
            - {name: DATABASE_URL, value: "jdbc:postgresql://menu-db:5432/menudb"}
            - {name: DB_USER, value: menuuser}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 5001}
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 5001}
            initialDelaySeconds: 240
            periodSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: 1000m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: foodapp
spec:
  type: NodePort
  selector: {app: menu-service}
  ports: [{port: 5001, targetPort: 5001, nodePort: 30001}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: menu-service-hpa
  namespace: foodapp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: menu-service}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
